# Scrapes both chat servers' /metrics (port 9090 inside the compose network).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: chat-server
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["chat-server-1:9090", "chat-server-2:9090"]
        labels:
          service: chat-server

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
