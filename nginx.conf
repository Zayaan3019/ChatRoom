events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# TCP Load Balancing for Chat Protocol
stream {
    upstream chat_backend {
        least_conn;  # Load balance by least connections
        server chat-server-1:8888 max_fails=3 fail_timeout=30s;
        server chat-server-2:8888 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8888;
        proxy_pass chat_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;  # 5 minutes for long-lived connections
        proxy_socket_keepalive on;
    }
}

# HTTP for Metrics and Health Endpoints
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream for metrics endpoints
    upstream metrics_backend {
        server chat-server-1:9090;
        server chat-server-2:9090;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            proxy_pass http://metrics_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Prometheus metrics endpoint
        location /metrics {
            proxy_pass http://metrics_backend/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Optional: restrict access to metrics
            # allow 10.0.0.0/8;
            # deny all;
        }

        # Server statistics endpoint
        location /stats {
            proxy_pass http://metrics_backend/stats;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Nginx status (optional)
        location /nginx_status {
            stub_status on;
            access_log off;
            
            # Restrict access
            allow 127.0.0.1;
            allow 172.25.0.0/16;  # Docker network
            deny all;
        }

        # Default route
        location / {
            return 200 "Chat Server Load Balancer\n";
            add_header Content-Type text/plain;
        }
    }
}
