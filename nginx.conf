events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# TCP load balancing for the chat protocol, with TLS ending here.
#
# Rooms live in Redis, not in a server, so any client can go to any server:
# no sticky sessions are needed.
stream {
    upstream chat_backend {
        least_conn;  # Load balance by least connections
        server chat-server-1:8888 max_fails=3 fail_timeout=30s;
        server chat-server-2:8888 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8888 ssl;

        # Written by the compose `init` service (scripts/init_secrets.py).
        ssl_certificate     /run/secrets/server.pem;
        ssl_certificate_key /run/secrets/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:chat_tls:10m;  # resumption: cheaper reconnects
        ssl_session_timeout 1h;
        ssl_handshake_timeout 10s;

        proxy_pass chat_backend;
        # Tell the server who the client really is (PROXY protocol v1), so
        # its per-IP limits apply to clients, not to this proxy.
        proxy_protocol on;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;  # 5 minutes for long-lived connections
        proxy_socket_keepalive on;
    }
}

# HTTP for Metrics and Health Endpoints
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream for metrics endpoints
    upstream metrics_backend {
        server chat-server-1:9090;
        server chat-server-2:9090;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            proxy_pass http://metrics_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Prometheus metrics endpoint
        location /metrics {
            proxy_pass http://metrics_backend/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Optional: restrict access to metrics
            # allow 10.0.0.0/8;
            # deny all;
        }

        # Server statistics endpoint
        location /stats {
            proxy_pass http://metrics_backend/stats;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Nginx status (optional)
        location /nginx_status {
            stub_status on;
            access_log off;
            
            # Restrict access
            allow 127.0.0.1;
            allow 10.0.0.0/8;      # private networks (Docker's bridge
            allow 172.16.0.0/12;   # networks come from these ranges)
            allow 192.168.0.0/16;
            deny all;
        }

        # Default route
        location / {
            return 200 "Chat Server Load Balancer\n";
            add_header Content-Type text/plain;
        }
    }
}
