version: '3.8'

services:
  # Chat Server Instance 1
  chat-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-server-1
    ports:
      - "8888:8888"
      - "9091:9090"
    environment:
      - CHAT_SERVER_HOST=0.0.0.0
      - CHAT_SERVER_PORT=8888
      - CHAT_METRICS_PORT=9090
      - CHAT_MAX_CONNECTIONS=10000
      - CHAT_MAX_MESSAGES_PER_MINUTE=60
      - CHAT_ENABLE_RATE_LIMITING=true
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Chat Server Instance 2
  chat-server-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-server-2
    ports:
      - "8889:8888"
      - "9092:9090"
    environment:
      - CHAT_SERVER_HOST=0.0.0.0
      - CHAT_SERVER_PORT=8888
      - CHAT_METRICS_PORT=9090
      - CHAT_MAX_CONNECTIONS=10000
      - CHAT_MAX_MESSAGES_PER_MINUTE=60
      - CHAT_ENABLE_RATE_LIMITING=true
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "80:80"
      - "8888:8888"  # TCP load balancing for chat
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-server-1
      - chat-server-2
    restart: unless-stopped
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: chat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: chat-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  chat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
